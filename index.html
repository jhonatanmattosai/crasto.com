<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crasto.com — Tecnologia e Neurociências. Mentorias, Treinamentos e Consultoria.">
  <title>CRASTO — Go Beyond</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; }
    .soon {
      text-align: center;
      opacity: 0;
      animation: emerge 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    .soon-line {
      width: 28px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 auto 24px;
    }
    .soon h1 {
      font-family: 'Cormorant', serif;
      font-weight: 300;
      font-size: 42px;
      color: var(--white);
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .soon p {
      font-weight: 200;
      font-size: 13px;
      color: var(--grey);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="soon">
    <div class="soon-line"></div>
    <h1>CRASTO</h1>
    <p>Em breve</p>
  </div>
</body>
</html>
